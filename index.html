<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Cá Nhân - Duongg</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <div class="pure-code-silk-bg">
        <div class="silk-ribbon ribbon-1"></div>
        <div class="silk-ribbon ribbon-2"></div>
        <div class="silk-ribbon ribbon-3"></div>
    </div>

    <div class="app-wrapper">
        <main class="apple-glass-card">
            
            <section class="profile-header-section">
                <div class="top-header-bar">
                    <div class="brand-logo glass-interactive">
                        <img src="./images/logo.png" alt="Logo" class="logo-img" onerror="this.style.display='none'">
                    </div>
                </div>

                <div class="profile-header">
                    <div class="avatar-wrapper glass-interactive">
                        <img src="./images/avatar.png" alt="Avatar" class="avatar-img" id="user-avatar" onerror="this.src='https://via.placeholder.com/150'">
                    </div>
                    <h1 class="profile-name" id="user-name">DUONGG</h1>
                    <p class="profile-subtitle">PROFILE</p>
                    <div class="accent-bar"></div>
                </div>
            </section>

            <section class="liquid-section-card">
                <h3 class="section-title"><i class="fas fa-id-card"></i> THÔNG TIN CHÍNH</h3>
                <ul class="info-list" id="primary-info"></ul>

                <div class="quick-actions-grid">
                    <a href="#" id="btn-call" class="action-btn glass-interactive">
                        <i class="fas fa-phone-alt"></i>
                        <span>Gọi điện</span>
                    </a>
                    <a href="#" id="btn-email" class="action-btn glass-interactive">
                        <i class="fas fa-envelope"></i>
                        <span>Email</span>
                    </a>
                    <a href="#" id="btn-map" target="_blank" class="action-btn glass-interactive">
                        <i class="fas fa-map-marker-alt"></i>
                        <span>Địa chỉ</span>
                    </a>
                </div>

                <div class="accordion-wrapper" style="margin-top: 24px;">
                    <button class="liquid-accordion-btn glass-interactive" onclick="toggleAccordion(this)">
                        <span>CHI TIẾT MỞ RỘNG</span>
                        <i class="fas fa-chevron-down arrow-icon"></i>
                    </button>
                    <div class="accordion-body">
                        <div class="inner-glass-panel">
                            <div id="extended-info"></div>

                            <div class="hobby-section" style="margin-top: 10px;">
                                <span class="label-title"><i class="fas fa-heart"></i> Sở thích / Kỹ năng</span>
                                <div class="tags-grid" id="hobby-tags"></div>
                            </div>

                            <div class="desc-box">
                                <span class="label-title"><i class="fas fa-quote-left"></i> Mô tả ngắn</span>
                                <p class="desc-text" id="short-bio"></p>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <section class="liquid-section-card">
                <h3 class="section-title"><i class="fas fa-share-nodes"></i> LIÊN HỆ & MẠNG XÃ HỘI</h3>
                <div class="social-glass-grid" id="social-links"></div>
            </section>

            <div class="app-footer">
                © 2026 Duongg. All rights reserved.
            </div>

        </main>
    </div>

    <script src="./script.js"></script>
</body>
</html>
